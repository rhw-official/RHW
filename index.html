<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Service Suspended</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4">

  <div class="max-w-md w-full bg-slate-800 rounded-2xl shadow-2xl p-8 border border-slate-700 text-center">
    <!-- Icon -->
    <div class="w-20 h-20 bg-amber-500/10 text-amber-500 rounded-full flex items-center justify-center text-4xl mx-auto mb-6 border border-amber-500/20">
      <i class="fa-solid fa-triangle-exclamation"></i>
    </div>

    <!-- Title -->
    <h1 class="text-2xl font-bold text-slate-100 mb-2">Website Temporarily Unavailable</h1>
    
    <!-- Subtitle / Message -->
    <p class="text-slate-400 text-sm mb-6 leading-relaxed">
      This website has been temporarily suspended due to  unpaid payment.
    </p>

    <!-- Details Box -->
    <div class="bg-slate-900/60 rounded-xl p-4 border border-slate-700/50 text-left text-xs text-slate-400 mb-6 space-y-2">
      <div class="flex justify-between">
        <span class="text-slate-500">Status:</span>
        <span class="text-red-400 font-semibold">Suspended</span>
      </div>
      <div class="flex justify-between">
        <span class="text-slate-500">Reason:</span>
        <span class="text-slate-300">Pending Bill Payment / Agreement</span>
      </div>
    </div>

    <!-- Contact Developer Note -->
    <p class="text-xs text-slate-500">
      If you are the site owner, please contact your web developer to restore access.
    </p>
  </div>

</body>
</html>
